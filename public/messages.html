<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - Skill Match</title>
    <link rel="stylesheet" href="style.css">
    <style>

        .messenger-container {
            display: flex;
            background: white;
            height: 80vh;
            width: 100%;
            max-width: 1100px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            margin: 20px auto;
        }
        .sidebar { width: 350px; border-right: 1px solid #eee; display: flex; flex-direction: column; background: #fdfbff; }
        .sidebar-header { padding: 20px; font-size: 1.5rem; font-weight: bold; color: #4B0082; }
        .contact { display: flex; align-items: center; padding: 12px 20px; gap: 12px; cursor: pointer; transition: 0.2s; }
        .contact:hover { background: #f3f0ff; }
        .contact.active { background: #e0b0ff; }
        .pfp { width: 50px; height: 50px; border-radius: 50%; background: #9370DB; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; flex-shrink: 0; font-size: 1.2rem; }
        .pfp-small { width: 32px; height: 32px; font-size: 0.8rem; }
        .chat-area { flex: 1; display: flex; flex-direction: column; background: white; }
        .chat-header { padding: 15px 25px; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 10px; font-weight: bold; }
        #chatDisplay { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .msg-row { display: flex; gap: 8px; width: 100%; align-items: flex-end; }
        .msg-row.sent-row { justify-content: flex-end; }
        .bubble { max-width: 65%; padding: 10px 16px; border-radius: 18px; font-size: 0.95rem; }
        .received { background: #f0f0f0; color: #333; border-bottom-left-radius: 4px; }
        .sent { background: #9370DB; color: white; border-bottom-right-radius: 4px; }
        .input-bar { padding: 15px; border-top: 1px solid #eee; display: flex; gap: 10px; }
        #replyText { border-radius: 20px; padding: 10px 20px; background: #f0f2f5; border: none; flex: 1; resize: none; height: 40px; }
        #sendBtn { width: 70px; border-radius: 20px; }
    </style>
</head>
<body>

    <nav>
        <div class="logo"><strong>Skill Match</strong></div>
        <ul>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="profile.html">Profile</a></li>
            <li><a href="index.html" class="logout-btn" onclick="localStorage.clear()">Log Out</a></li>
        </ul>
    </nav>

    <div class="messenger-container">
        <div class="sidebar">
            <div class="sidebar-header">Chats</div>
            <div id="contacts-container"></div>
        </div>

        <div class="chat-area">
            <div class="chat-header" id="activeChatHeader">
                Select a conversation
            </div>
            
            <div id="chatDisplay"></div>

            <form id="replyForm" class="input-bar">
                <textarea id="replyText" placeholder="Aa" required></textarea>
                <button type="submit" class="submit-btn" id="sendBtn">Send</button>
            </form>
        </div>
    </div>

    <script>
        let activeReceiverId = null;
        const currentUserId = localStorage.getItem('userId');

        // 1. Open Chat
        async function openChat(name, initial, userId) {
            activeReceiverId = userId;
            document.getElementById('activeChatHeader').innerHTML = `
                <div class="pfp pfp-small">${initial}</div>
                ${name}
            `;
            loadMessages();
        }

        // 2. Fetch History
        async function loadMessages() {
            if (!activeReceiverId || !currentUserId) return;
            const chatDisplay = document.getElementById('chatDisplay');
            
            try {
                const res = await fetch(`/api/get-messages?sender=${currentUserId}&receiver=${activeReceiverId}`);
                const messages = await res.json();
                
                chatDisplay.innerHTML = ""; 
                messages.forEach(msg => {
                    const row = document.createElement('div');
                    const isSentByMe = msg.sender_id == currentUserId;
                    row.className = isSentByMe ? "msg-row sent-row" : "msg-row";
                    row.innerHTML = `<div class="bubble ${isSentByMe ? 'sent' : 'received'}">${msg.message_text}</div>`;
                    chatDisplay.appendChild(row);
                });
                chatDisplay.scrollTo({ top: chatDisplay.scrollHeight });
            } catch (err) {
                console.error("Error loading messages:", err);
            }
        }

        // 3. Load Contacts
        async function loadContacts() {
            const container = document.getElementById('contacts-container');
            try {
                const res = await fetch('/api/my-contacts');
                const contacts = await res.json();

                if (contacts.length === 0) {
                    container.innerHTML = '<p style="padding:20px; color:gray; font-size:0.8rem;">No users found.</p>';
                    return;
                }

                container.innerHTML = ''; 
                contacts.forEach(user => {
                    const contactDiv = document.createElement('div');
                    contactDiv.className = 'contact';
                    const icon = user.pfp_icon || (user.username ? user.username.charAt(0).toUpperCase(): "?");


                    contactDiv.innerHTML = `
                        <div class="pfp">${icon}</div>
                        <div class="contact-info">
                            <span class="contact-name">${user.username}</span>
                        </div>
                    `;
                    contactDiv.onclick = () => openChat(user.username, icon, user.user_id);
                    container.appendChild(contactDiv);
                });
            } catch (err) {
                console.error("Failed to load contacts");
            }
        }

        // 4. Handle Sending (Merged Logic)
        document.getElementById('replyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = document.getElementById('replyText').value;
            const senderId = localStorage.getItem('userId');

            if (!activeReceiverId || !senderId) {
                alert("Please select a user to chat with.");
                return;
            }

            try {
                const res = await fetch('/api/reply-message', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message_text: text, 
                        receiverId: activeReceiverId,
                        senderId: senderId 
                    })
                });

                if (res.ok) {
                    document.getElementById('replyText').value = "";
                    loadMessages(); 
                }
            } catch (err) {
                console.error("Fetch error:", err);
            }
        });

        loadContacts();
        setInterval(loadMessages, 3000); 
    </script>
</body>
</html>
