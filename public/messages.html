<!DOCTYPE html>
<html>
<head>
<title>Messages</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="container">

<div class="content-box">
<h2>Messages</h2>

<div id="contacts"></div>
</div>

<div class="content-box">
<h3>Chat</h3>
<div id="chat"></div>

<form id="form">
<input id="msg" placeholder="Message">
<button>Send</button>
</form>

</div>

</div>

<script>
let active = null;
const userId = localStorage.getItem("userId");

if (!userId) window.location.href="/index.html";

async function loadContacts(){
const res = await fetch("/api/my-contacts");
const data = await res.json();

document.getElementById("contacts").innerHTML =
data.map(u =>
`<div onclick="openChat(${u.user_id},'${u.name}')">
${u.name}
</div>`).join("");
}

async function openChat(id,name){
active = id;
loadChat();
}

async function loadChat(){
if(!active) return;

const res = await fetch(`/api/get-messages?sender=${userId}&receiver=${active}`);
const data = await res.json();

document.getElementById("chat").innerHTML =
data.map(m => `<p>${m.message_text}</p>`).join("");
}

document.getElementById("form").onsubmit = async (e)=>{
e.preventDefault();

await fetch("/api/reply-message",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
senderId:userId,
receiverId:active,
message_text:document.getElementById("msg").value
})
});

document.getElementById("msg").value="";
loadChat();
};

loadContacts();
setInterval(loadChat,3000);
</script>

</body>
</html>
