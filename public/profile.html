<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - Skill Match</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .profile-wrapper {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: calc(100vh - var(--nav-height));
      padding: 40px 20px;
    }

    .profile-card {
      width: 100%;
      max-width: 620px;
      text-align: center;
      animation: fadeUp 0.45s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .profile-pfp {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6d28d9, #4f46e5);
      margin: 0 auto 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.2rem;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.25s, box-shadow 0.25s;
      box-shadow: 0 8px 24px rgba(109, 40, 217, 0.38);
      border: 3px solid rgba(255, 255, 255, 0.5);
    }

    .profile-pfp:hover {
      transform: scale(1.06);
      box-shadow: 0 12px 32px rgba(109, 40, 217, 0.5);
    }

    .pfp-hint {
      font-size: 0.78rem;
      color: var(--text-soft);
      margin-bottom: 18px;
    }

    .profile-card h1 {
      font-size: 1.9rem;
      margin-bottom: 4px;
    }

    .profile-email {
      font-size: 0.9rem;
      color: var(--text-soft);
      margin-bottom: 30px;
    }

    .profile-section {
      text-align: left;
      border-top: 1px solid rgba(167, 139, 250, 0.25);
      padding-top: 24px;
    }

    .profile-section label {
      margin-bottom: 10px;
    }

    .profile-section textarea {
      height: 130px;
      resize: none;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

<nav>
  <div class="logo">Skill Match</div>
  <ul>
    <li><a href="dashboard.html">Dashboard</a></li>
    <li><a href="messages.html">Messages</a></li>
    <li><a href="index.html" class="logout-btn" onclick="logoutUser()">Logout</a></li>
  </ul>
</nav>

<div class="profile-wrapper">
  <div class="profile-card">

    <div class="profile-pfp" id="profilePfp" onclick="changePfp()">👤</div>
    <p class="pfp-hint">Click to change icon</p>

    <h1 id="profileName">Loading...</h1>
    <p class="profile-email" id="profileEmail">Loading...</p>

    <div class="profile-section">
      <label>About Me</label>
      <textarea id="bioInput" placeholder="Tell something about yourself..."></textarea>
      <button onclick="saveBio()">Save Changes</button>
    </div>

  </div>
</div>

<script>
  const userId = localStorage.getItem('userId');
  if (!userId) window.location.href = 'index.html';

  async function loadProfile() {
    try {
      const res  = await fetch(`/api/user-data?userId=${userId}`);
      const user = await res.json();

      document.getElementById('profileName').innerText  = user.username;
      document.getElementById('profileEmail').innerText = user.email;
      document.getElementById('bioInput').value         = user.bio || '';
      document.getElementById('profilePfp').innerText   = user.pfp_icon || user.username[0].toUpperCase();
    } catch (err) { console.log(err); }
  }

  async function saveBio() {
    const bio = document.getElementById('bioInput').value;
    const btn = document.querySelector('button');
    btn.textContent = 'Saving...';
    btn.disabled = true;

    try {
      const res  = await fetch('/api/update-bio', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ bio, userId })
      });
      const data = await res.json();
      alert(data.success ? 'Profile updated!' : 'Failed to update profile.');
    } catch (err) { console.log(err); }

    btn.textContent = 'Save Changes';
    btn.disabled = false;
  }

  async function changePfp() {
    const newIcon = prompt('Enter an emoji or letter for your profile icon:');
    if (!newIcon) return;

    try {
      const res  = await fetch('/api/update-pfp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pfp_icon: newIcon, userId })
      });
      const data = await res.json();
      if (data.success) {
        document.getElementById('profilePfp').innerText = newIcon;
        alert('Profile icon updated!');
      }
    } catch (err) { console.log(err); }
  }

  function logoutUser() { localStorage.clear(); }

  loadProfile();
</script>

</body>
</html>
