<!DOCTYPE html>
<html>
<head>
<title>Profile</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="content-box">

<h2>Profile</h2>

<h3 id="name"></h3>
<p id="email"></p>

<textarea id="bio"></textarea>
<button onclick="save()">Save</button>

</div>

<script>
const userId = localStorage.getItem("userId");

if (!userId) window.location.href="/index.html";

async function load(){
const res = await fetch("/api/user-data?userId="+userId);
const u = await res.json();

document.getElementById("name").innerText=u.name;
document.getElementById("email").innerText=u.email;
document.getElementById("bio").value=u.bio||"";
}

async function save(){
await fetch("/api/update-bio",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
userId,
bio:document.getElementById("bio").value
})
});

alert("Saved");
}

load();
</script>

</body>
</html>
