<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<nav>
<h2>Skill Match</h2>
<a href="/index.html">Logout</a>
</nav>

<div class="container">

<h2 id="welcome"></h2>

<!-- CREATE POST -->
<form action="/add-post" method="POST">

    <input type="hidden" name="userId" id="userId">

    <select name="post_type">
        <option value="Offering">Offer Skill</option>
        <option value="Requesting">Request Skill</option>
    </select>

    <input name="skill_name" placeholder="Skill name" required>
    <textarea name="description" placeholder="Description"></textarea>

    <button type="submit">Post</button>
</form>

<hr>

<h3>Feed</h3>
<div id="feed"></div>
<style>
.post {
    background: rgba(255,255,255,0.9);
    padding: 15px;
    border-radius: 15px;
    margin: 15px 0;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

.post-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
}

.avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #9370DB;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}

.badge {
    font-size: 12px;
    padding: 3px 8px;
    border-radius: 10px;
    margin-left: 8px;
}

.offer {
    background: #4CAF50;
    color: white;
}

.request {
    background: #FF4D4D;
    color: white;
}
</style>

</div>

<script>
const userId = localStorage.getItem("userId");
const username = localStorage.getItem("username");

if (!userId) {
    window.location.href = "/index.html";
}

/* Set hidden userId properly */
document.getElementById("userId").value = userId;

/* Welcome text */
document.getElementById("welcome").innerText =
"Welcome " + username;

/* Load feed */
async function loadFeed() {
    const res = await fetch("/api/search-skills?query=");
    const data = await res.json();

    const feed = document.getElementById("feed");

    feed.innerHTML = data.map(post => {

        const initial = post.name ? post.name.charAt(0).toUpperCase() : "?";
        const badgeClass = post.type === "Offering" ? "offer" : "request";

        return `
        <div class="post">

            <div class="post-header">
                <div class="avatar">
                    ${post.pfp_icon || initial}
                </div>

                <strong>${post.name}</strong>

                <span class="badge ${badgeClass}">
                    ${post.type}
                </span>
            </div>

            <h3>${post.skill_name}</h3>
            <p>${post.description}</p>

        </div>
        `;
    }).join("");
}

loadFeed();
</script>

</body>
</html>
