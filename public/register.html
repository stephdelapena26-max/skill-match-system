<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skill Match - Register</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .register-container {
      width: 100%;
      max-width: 440px;
      padding: 20px;
      animation: fadeUp 0.5s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .login-card {
      text-align: center;
    }

    .logo-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6d28d9, #4f46e5);
      margin: 0 auto 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Outfit', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      color: white;
      box-shadow: 0 8px 24px rgba(109, 40, 217, 0.4);
    }

    .login-card h1 { font-size: 2rem; margin-bottom: 6px; }

    .login-card .subtitle {
      font-size: 0.95rem;
      color: var(--text-soft);
      margin-bottom: 28px;
    }

    .login-card form { text-align: left; }

    .bottom-link {
      margin-top: 22px;
      font-size: 0.9rem;
      color: var(--text-soft);
    }
  </style>
</head>
<body>

<div class="register-container">
  <div class="login-card">

    <div class="logo-circle">S</div>
    <h1>Create Account</h1>
    <p class="subtitle">Join Skill Match today</p>

    <form id="registerForm">
      <input type="text"     id="regUsername" placeholder="Username"        required>
      <input type="email"    id="regEmail"    placeholder="Email Address"   required>
      <input type="password" id="regPassword" placeholder="Password"        required>
      <button type="submit"  id="regBtn">Create Account</button>
    </form>

    <div class="bottom-link">
      Already have an account? <a href="index.html">Login here</a>
    </div>

  </div>
</div>

<script>
  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const username = document.getElementById('regUsername').value;
    const email    = document.getElementById('regEmail').value;
    const password = document.getElementById('regPassword').value;
    const btn      = document.getElementById('regBtn');

    btn.textContent = 'Creating account...';
    btn.disabled = true;

    try {
      const res  = await fetch('/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, email, password })
      });

      const data = await res.json();

      if (data.success) {
        alert('Account created! Please login.');
        window.location.href = 'index.html';
      } else {
        alert(data.error || 'Registration failed. Email may already be taken.');
        btn.textContent = 'Create Account';
        btn.disabled = false;
      }
    } catch (err) {
      alert('Connection error. Please try again.');
      btn.textContent = 'Create Account';
      btn.disabled = false;
    }
  });
</script>

</body>
</html>
