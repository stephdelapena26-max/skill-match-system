<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Register - Skill Match
</title>

<link rel="stylesheet" href="style.css">

<style>

body{

display:flex;
justify-content:center;
align-items:center;

min-height:100vh;

margin:0;
padding:0;

}

.register-container{

width:100%;
max-width:450px;

padding:20px;

}

.register-card{

background:white;

padding:40px;

border-radius:25px;

box-shadow:
0 10px 30px rgba(0,0,0,0.15);

text-align:center;

}

.logo-circle{

width:90px;
height:90px;

border-radius:50%;

background:#6366f1;

margin:0 auto 20px;

display:flex;
align-items:center;
justify-content:center;

font-size:2.5rem;

font-weight:bold;

color:white;

}

.register-card h1{

margin:0;

font-size:2.2rem;

color:#4B0082;

}

.register-card p{

opacity:0.7;

margin-top:10px;

margin-bottom:30px;

}

.register-card input{

margin-bottom:18px;

}

.register-card button{

margin-top:10px;

}

.bottom-link{

margin-top:25px;

font-size:0.95rem;

}

.bottom-link a{

font-weight:bold;

}

</style>

</head>

<body>

<div class="register-container">

<div class="register-card">

<div class="logo-circle">

S

</div>

<h1>

Create Account

</h1>

<p>

Join the Skill Match community

</p>

<form
action="/register"
method="POST"
>

<input
type="text"
name="username"
placeholder="Full Name"
required
>

<input
type="email"
name="email"
placeholder="Email Address"
required
>

<input
type="password"
name="password"
placeholder="Password"
required
>

<button type="submit">

Register

</button>

</form>

<div class="bottom-link">

Already have an account?

<a href="index.html">

Login here

</a>

</div>

</div>

</div>

</body>

</html>
