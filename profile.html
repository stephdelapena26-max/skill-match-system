<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Skill Match</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <div class="logo"><strong>Skill Match</strong></div>
        <ul>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="messages.html">Messages</a></li>
            <li><a href="index.html" class="logout-btn">Log Out</a></li>
        </ul>
    </nav>

    <div class="container">
        
        <div class="content-box" style="text-align: center;">
            <div id="pfp-container" onclick="updatePFP()" style="width: 120px; height: 120px; background: #9370DB; border-radius: 50%; margin: 0 auto 10px; border: 4px solid #E0B0FF; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; position: relative;">
                <span id="pfp-icon" style="font-size: 3rem; color: white; font-weight: bold;">👤</span>
            </div>
            <p style="font-size: 0.8rem; color: #6A5ACD; margin-bottom: 20px;">Click to change icon</p>

            <h1 id="profile-username" style="margin: 0; color: #4B0082;">abcde</h1>
            <p id="profile-email" style="color: #6A5ACD; margin-top: 5px;">abcde@gmail.com</p>
            
            <hr style="border: 0.5px solid #eee; margin: 25px 0;">

            <div style="text-align: left;">
                <label style="font-weight: bold; color: #4B0082;">About Me:</label>
                <textarea id="profile-bio" style="width: 100%; height: 100px; padding: 12px; margin-top: 10px; border: 1px dashed #9370DB; border-radius: 10px; font-family: inherit; resize: none;"></textarea>
                
                <button class="submit-btn" id="save-btn" onclick="saveBio()" style="margin-top: 15px;">Save Changes</button>
            </div>
        </div>

    </div>

    <script>
        // NEW: Function to change the PFP Icon
        async function updatePFP() {
            const newIcon = prompt("Enter a new initial or emoji for your PFP (e.g., 'A' or '💻'):");
            
            if (newIcon && newIcon.length <= 2) {
                try {
                    const response = await fetch('/api/update-pfp', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ pfp_icon: newIcon })
                    });

                    if (response.ok) {
                        document.getElementById('pfp-icon').innerText = newIcon;
                        alert("PFP Updated!");
                    }
                } catch (err) {
                    alert("Error connecting to server.");
                }
            } else if (newIcon) {
                alert("Please enter only 1-2 characters!");
            }
        }

        async function loadProfile() {
            try {
                const res = await fetch('/api/user-data');
                const user = await res.json();
                
                document.getElementById('profile-username').innerText = user.username;
                document.getElementById('profile-email').innerText = user.email;
                document.getElementById('profile-bio').value = user.bio || "";
                
                // UPDATED: Load PFP icon from DB, fallback to username initial
                if (user.pfp_icon) {
                    document.getElementById('pfp-icon').innerText = user.pfp_icon;
                } else {
                    document.getElementById('pfp-icon').innerText = user.username.charAt(0).toUpperCase();
                }
            } catch (err) {
                console.log("Error loading profile");
            }
        }

        async function saveBio() {
            const newBio = document.getElementById('profile-bio').value;
            const btn = document.getElementById('save-btn');
            
            btn.innerText = "Saving...";
            
            try {
                const response = await fetch('/api/update-bio', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ bio: newBio })
                });

                if (response.ok) {
                    alert("Profile Updated Successfully!");
                }
            } catch (err) {
                alert("Error saving bio.");
            } finally {
                btn.innerText = "Save Changes";
            }
        }

        loadProfile();
    </script>
</body>
</html>
