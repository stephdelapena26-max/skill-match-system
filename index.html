<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Match - Login</title>
    <style>
        /* Updated to the Light Purple / Lavender theme */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #E6E6FA; /* Light Lavender background */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background-color: white;
            padding: 40px;
            border-radius: 20px; /* Softer rounded corners */
            box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 320px;
        }
        h1 {
            color: #9370DB; /* Medium Purple for the title */
            margin-bottom: 5px;
            font-size: 28px;
        }
        p {
            color: #888;
            font-size: 14px;
            margin-bottom: 25px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            background-color: #fcfcfc;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #9370DB; /* Matching light purple button */
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover {
            background-color: #8a2be2;
        }
        .register-link {
            margin-top: 20px;
            font-size: 13px;
        }
        .register-link a {
            color: #9370DB;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h1>Skill Match</h1>
        <p>Login to start sharing skills</p>
        
        <form action="/login" method="POST">
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>

        <div class="register-link">
            <p>New here? <a href="register.html">Create an account</a></p>
        </div>
    </div>

</body>
</html>
